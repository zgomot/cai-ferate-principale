<script>
var map = L.map('map').setView([45.8, 24.9], 7);

// Basemap
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap'
}).addTo(map);

// WMS
var wmsUrl = "https://geonoise.mmap.ro/ows/services/org.3.aa89e791-932a-4da2-9d3e-85447bfe5374_wms";

var railways = L.tileLayer.wms(wmsUrl, {
    layers: 'MajorRailwaySource',
    format: 'image/png',
    transparent: true
}).addTo(map);

// LEGENDĂ
var legend = L.control({position: 'bottomright'});

legend.onAdd = function (map) {
    var div = L.DomUtil.create('div', 'info legend');
    div.innerHTML = `
        <b>Legendă</b><br>
        <div style="display:flex; align-items:center;">
            <div style="width:20px;height:3px;background:black;margin-right:5px;"></div>
            Cale ferată principală
        </div>
    `;
    return div;
};

legend.addTo(map);
</script>
