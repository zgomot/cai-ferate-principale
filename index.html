<!DOCTYPE html>
<html>
<head>
    <title>Căi ferate principale (sursă)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <style>
        #map { height: 100vh; }
    </style>
</head>
<body>

<h2 style="position:absolute; z-index:1000; background:white; padding:5px;">
Căi ferate principale (sursă zgomot)
</h2>

<div id="map"></div>

<script>
var map = L.map('map').setView([45.8, 24.9], 7);

// Basemap
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap'
}).addTo(map);

// WMS URL
var wmsUrl = "https://geonoise.mmap.ro/ows/services/org.3.aa89e791-932a-4da2-9d3e-85447bfe5374_wms";

// Layer corect
var railways = L.tileLayer.wms(wmsUrl, {
    layers: 'MajorRailwaySource',
    format: 'image/png',
    transparent: true
}).addTo(map);

</script>

</body>
</html>
