<!DOCTYPE html>
<html>
<head>
    <title>Căi ferate principale</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <style>
        #map { height: 100vh; }
        .legend {
            background: white;
            padding: 10px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<h3 style="position:absolute; z-index:1000; background:white; padding:5px;">
Căi ferate principale (sursă zgomot)
</h3>

<div id="map"></div>

<script>
var map = L.map('map').setView([45.8, 24.9], 7);

// Basemap
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap'
}).addTo(map);

// WMS
var wmsUrl = "https://geonoise.mmap.ro/ows/services/org.3.aa89e791-932a-4da2-9d3e-85447bfe5374_wms";

var railways = L.tileLayer.wms(wmsUrl, {
    layers: 'MajorRailwaySource',
    format: 'image/png',
    transparent: true
}).addTo(map);

// Legendă
var legend = L.control({position: 'bottomright'});

legend.onAdd = function () {
    var div = L.DomUtil.create('div', 'legend');
    div.innerHTML = `
        <b>Legendă</b><br>
        <div style="display:flex; align-items:center;">
            <div style="width:25px;height:3px;background:black;margin-right:5px;"></div>
            Cale ferată principală
        </div>
    `;
    return div;
};

legend.addTo(map);

</script>

</body>
</html>
